<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <meta name="color-scheme" content="light" />
  <title>认数字 Numberblocks</title>
  <link rel="stylesheet" href="./assets/numberblocks-character.css" />
  <link rel="stylesheet" href="./assets/numberblocks.css" />
  <link rel="stylesheet" href="./assets/numberblocks-host.css" />
</head>
<body>
  <div id="app">
    <div id="gallery"></div>
    <div id="stage">
      <div class="stage-top" id="stageTop">
        <button class="back-btn" id="backBtn" type="button">‹ 长廊</button>
        <div class="stage-num" id="stageNum">1</div>
        <div class="stage-count" id="stageCount">已认识 0 / 20</div>
      </div>
      <div class="stage-body" id="stageBody">
        <div class="stage-space" id="stageSpace"></div>
        <div class="stage-hint">拖一拖能转，点一下再听一次</div>
      </div>
      <div class="stage-rail" id="stageRail"></div>
      <div class="stage-actions">
        <button class="act-btn" id="replayBtn" type="button">🔊 再听一次</button>
        <button class="act-btn" id="tourBtn" type="button">▶ 自动巡游</button>
      </div>
    </div>
  </div>
  <script src="./assets/numberblocks-models.js"></script>
  <script src="./assets/numberblocks-data.js"></script>
  <script src="./assets/numberblocks-scene.js"></script>
</body>
</html>
