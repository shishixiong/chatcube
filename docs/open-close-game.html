<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>宝石记忆 · 翻牌配对小游戏</title>
<meta name="description" content="宝石主题记忆翻牌小游戏，5 个递进难度层级。" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11141b" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceef4" />
<style>
/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }

  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }

  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }

  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

:root {
  --ground: #11141b;
  --ground-2: #0c0e14;
  --surface: #1b202b;
  --surface-2: #232a37;
  --surface-3: #2b3444;
  --line: #313b4d;
  --text: #ece9e2;
  --muted: #9aa4b4;
  --accent: #c9a24a;
  --accent-2: #e4c878;
  --accent-ink: #171a20;
  --ok: #5fc79a;
  --danger: #e0806f;
  --radius-card: 12px;
  --radius-panel: 16px;
  --radius-pill: 999px;
  --board-gap: clamp(6px, 1.6vw, 12px);
  --flip: 280ms;
  --dur-fast: 150ms;
  --dur-enter: 220ms;
  --dur-exit: 150ms;
  --ease-out: cubic-bezier(.21,.8,.36,1);
  --ease-in: cubic-bezier(.55,0,.8,.4);

  /* 主题语义色（随明暗模式重设） */
  --sheen: rgba(255,255,255,.05);
  --cover-ink: #4a566c;
  --glow-1: rgba(201,162,74,.08);
  --glow-2: rgba(95,143,230,.06);
  --scrim: rgba(9,11,16,.72);
  --shadow-strong: rgba(0,0,0,.8);
  --shadow-float: rgba(0,0,0,.9);
  --accent-glow: rgba(201,162,74,.7);
  --ok-ring: rgba(95,199,154,.7);
  --ok-ring-soft: rgba(95,199,154,.35);
  --ok-ink: #0d1a14;

  color-scheme: dark;
}

/* 跟随系统配色：浅色主题（独立审计的对比度，非深色模式的推导） */
@media (prefers-color-scheme: light) {
  :root {
    --ground: #eceef4;
    --ground-2: #e2e6ef;
    --surface: #ffffff;
    --surface-2: #f4f5f9;
    --surface-3: #e7eaf1;
    --line: #d3d8e2;
    --text: #1a1e27;
    --muted: #57606f;
    --accent: #7a5c12;
    --accent-2: #8a6714;
    --accent-ink: #ffffff;
    --ok: #1f8a5c;
    --danger: #c0503c;

    --sheen: rgba(0,0,0,.035);
    --cover-ink: #6b7488;
    --glow-1: rgba(201,162,74,.16);
    --glow-2: rgba(95,143,230,.10);
    --scrim: rgba(20,24,32,.5);
    --shadow-strong: rgba(24,30,45,.16);
    --shadow-float: rgba(24,30,45,.24);
    --accent-glow: rgba(122,92,18,.32);
    --ok-ring: rgba(31,138,92,.6);
    --ok-ring-soft: rgba(31,138,92,.28);
    --ok-ink: #ffffff;

    color-scheme: light;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(1200px 620px at 50% -10%, var(--glow-1), transparent 62%),
    radial-gradient(900px 520px at 100% 100%, var(--glow-2), transparent 60%),
    var(--ground);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: Georgia, "Iowan Old Style", "Times New Roman", "Songti SC", serif; font-weight: 600; }

.stage { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }
.app {
  width: 100%;
  max-width: 960px;
  padding: 0 clamp(14px, 4vw, 32px) clamp(24px, 6vw, 56px);
  display: flex;
  flex-direction: column;
  gap: clamp(18px, 4vw, 30px);
  flex: 1;
}

/* ---------- App bar ---------- */
.appbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: clamp(16px, 3vw, 26px) 0 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: linear-gradient(160deg, var(--surface-3), var(--surface));
  color: var(--accent-2);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-text { display: grid; min-width: 0; }
.brand-text strong { font-family: Georgia, "Iowan Old Style", serif; font-size: 19px; letter-spacing: .01em; }
.brand-text span { color: var(--muted); font-size: 13px; }
.icon-btn {
  flex: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent-2); }
.icon-btn[aria-pressed="true"] { color: var(--accent-2); border-color: var(--accent); background: var(--surface-2); }
.icon-btn .icon-off { display: none; }
.icon-btn[aria-pressed="true"] .icon-on { display: none; }
.icon-btn[aria-pressed="true"] .icon-off { display: block; }

button:focus-visible, [tabindex]:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 2px;
  border-radius: 10px;
}

/* ---------- Views ---------- */
.view { display: flex; flex-direction: column; gap: clamp(16px, 3vw, 26px); }
.view[hidden] { display: none; }

.hero { display: grid; gap: 8px; max-width: 62ch; }
.hero h1 { margin: 0; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.18; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--muted); font-size: 16px; }

/* ---------- Level grid ---------- */
.levels {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: clamp(12px, 2vw, 18px);
}
.level-card {
  position: relative;
  display: grid;
  gap: 10px;
  text-align: left;
  padding: 18px 18px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: linear-gradient(165deg, var(--surface-2), var(--surface));
  color: var(--text);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.level-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 14px 30px -18px var(--shadow-strong); }
.level-card:active { transform: translateY(0); }
.level-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.level-no {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  flex: none;
  border-radius: 8px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  font-family: Georgia, serif;
  font-size: 15px;
  color: var(--accent-2);
}
.level-best { font-size: 12px; color: var(--muted); text-align: right; }
.level-name { font-family: Georgia, "Iowan Old Style", serif; font-size: 22px; line-height: 1.1; }
.level-meta { font-size: 13px; color: var(--muted); }
.level-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.level-stars { display: inline-flex; gap: 3px; color: var(--accent-2); }
.level-stars svg { width: 14px; height: 14px; display: block; }
.level-stars svg.empty { color: var(--surface-3); }
.level-gems { display: inline-flex; gap: 4px; }
.level-gems i { width: 12px; height: 12px; border-radius: 3px; display: block; }
/* 选关卡片错位淡入：仅位移 + 透明度；结束后释放动画值，悬停抬升不受影响 */
@keyframes level-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.level-card {
  animation: level-in var(--dur-enter) var(--ease-out) backwards;
  animation-delay: calc(var(--i, 0) * 40ms);
}

/* ---------- HUD ---------- */
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
}
.hud-stats { display: flex; gap: clamp(12px, 3vw, 28px); flex-wrap: wrap; }
.stat { display: grid; gap: 1px; min-width: 44px; }
.stat-num { font-family: Georgia, "Iowan Old Style", serif; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat-cap { font-size: 12px; color: var(--muted); }
.ghost-btn {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.ghost-btn:hover { border-color: var(--accent); color: var(--accent-2); background: var(--surface-2); }
.primary-btn {
  min-height: 44px;
  padding: 0 22px;
  border: 1px solid var(--accent);
  border-radius: var(--radius-pill);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.primary-btn:hover { background: var(--accent-2); border-color: var(--accent-2); }
.primary-btn:disabled { opacity: .45; cursor: not-allowed; }

/* ---------- Board ---------- */
.board-wrap { position: relative; display: grid; place-items: center; padding: 6px 0 4px; }
.board {
  display: grid;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 104px));
  gap: var(--board-gap);
  justify-content: center;
  width: 100%;
}
.card {
  position: relative;
  aspect-ratio: 1 / 1;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  perspective: 720px;
  -webkit-tap-highlight-color: transparent;
}
.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform var(--flip) var(--ease-out);
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face, .card-cover {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  border-radius: var(--radius-card);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 1px solid var(--line);
}
.card-cover {
  background:
    linear-gradient(150deg, var(--sheen), transparent 55%),
    var(--surface-2);
  color: var(--cover-ink);
}
.card-cover svg { width: 42%; height: 42%; }
.card:hover .card-cover { color: var(--accent); }
.card-face {
  transform: rotateY(180deg);
  background: linear-gradient(165deg, var(--surface-3), var(--surface));
}
.card-face .gem { width: 66%; height: 66%; display: block; }
.card:disabled { cursor: default; }
.card.matched .card-face {
  border-color: var(--ok-ring);
  box-shadow: inset 0 0 0 1px var(--ok-ring-soft);
}
.card.matched .gem { opacity: .82; }
.card.matched { animation: pop var(--dur-enter) var(--ease-out); }
.card .check {
  position: absolute;
  right: 5px; bottom: 5px;
  width: 18px; height: 18px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--ok);
  color: var(--ok-ink);
  opacity: 0;
  transform: scale(.5);
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.card .check svg { width: 12px; height: 12px; }
.card.matched .check { opacity: 1; transform: scale(1); }

@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }

.preview-hint {
  position: absolute;
  top: -2px; left: 50%;
  transform: translateX(-50%);
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
  box-shadow: 0 8px 20px -10px var(--accent-glow);
  pointer-events: none;
}
.preview-hint[hidden] { display: none; }

/* ---------- Win overlay ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--scrim);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.overlay[hidden] { display: none; }
.win-card {
  width: min(100%, 420px);
  display: grid;
  gap: 16px;
  justify-items: center;
  text-align: center;
  padding: clamp(22px, 5vw, 34px);
  border: 1px solid var(--line);
  border-radius: 20px;
  background: linear-gradient(170deg, var(--surface-3), var(--surface));
  box-shadow: 0 40px 80px -30px var(--shadow-float);
  animation: rise var(--dur-enter) var(--ease-out);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.win-spark { display: inline-flex; gap: 8px; color: var(--accent-2); }
.win-spark svg { width: 18px; height: 18px; }
.win-spark svg:nth-child(2) { width: 26px; height: 26px; margin-top: -6px; }
.win-card h2 { margin: 0; font-size: clamp(22px, 4vw, 28px); }
.win-stars { display: inline-flex; gap: 8px; color: var(--accent-2); }
.win-stars svg { width: 30px; height: 30px; }
.win-stars svg.empty { color: var(--surface-3); }
.win-stats { display: flex; gap: clamp(18px, 6vw, 40px); }
.wstat { display: grid; gap: 2px; }
.wstat span:first-child { font-family: Georgia, serif; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wstat span:last-child { font-size: 12px; color: var(--muted); }
.win-note { margin: 0; min-height: 1.6em; color: var(--accent-2); font-size: 14px; }
.win-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
.win-actions .primary-btn, .win-actions .ghost-btn { flex: 1 1 auto; }

.live {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- Motion preferences ---------- */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  .level-card { animation: none !important; }
  .card-inner { transition: opacity var(--dur-fast) linear; transform: none !important; }
  .card-face, .card-cover { backface-visibility: visible; -webkit-backface-visibility: visible; transition: opacity var(--dur-fast) linear; }
  .card-cover { transform: none; }
  .card-face { transform: none; opacity: 0; }
  .card.flipped .card-cover { opacity: 0; }
  .card.flipped .card-face { opacity: 1; }
  .card.flipped.matched .card-face { opacity: .82; }
}

/* ---------- Responsive ---------- */
@media (max-width: 560px) {
  .board { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
  .board-wrap { padding-inline: 2px; }
  .hud { padding: 12px; }
  .hud-stats { gap: 16px; }
  .level-card { padding: 16px; }
}
@media (max-width: 360px) {
  .hud-stats { gap: 12px; }
  .stat-num { font-size: 18px; }
}
</style>
</head>

<div class="live" id="live" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var GEM_NAMES = ['钻石','红宝石','蓝宝石','祖母绿','紫水晶','黄玉','橄榄石','石榴石','月光石','碧玺','青金石','孔雀石'];
  var LEVELS = [
    { id: 1, roman: 'I',   name: '见习', cols: 3, rows: 2, preview: 2500 },
    { id: 2, roman: 'II',  name: '学徒', cols: 4, rows: 3, preview: 2200 },
    { id: 3, roman: 'III', name: '行家', cols: 4, rows: 4, preview: 2000 },
    { id: 4, roman: 'IV',  name: '大师', cols: 5, rows: 4, preview: 1600 },
    { id: 5, roman: 'V',   name: '宗师', cols: 6, rows: 4, preview: 1200 }
  ];
  var BEST_KEY = 'gem-memory-best-v1';
  var SOUND_KEY = 'gem-memory-sound-v1';
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var el = {
    viewSelect: document.getElementById('view-select'),
    viewGame: document.getElementById('view-game'),
    levelList: document.getElementById('levelList'),
    board: document.getElementById('board'),
    previewHint: document.getElementById('previewHint'),
    statLevel: document.getElementById('statLevel'),
    statMoves: document.getElementById('statMoves'),
    statTime: document.getElementById('statTime'),
    statPairs: document.getElementById('statPairs'),
    backBtn: document.getElementById('backBtn'),
    restartBtn: document.getElementById('restartBtn'),
    soundBtn: document.getElementById('soundBtn'),
    winOverlay: document.getElementById('winOverlay'),
    winStars: document.getElementById('winStars'),
    winMoves: document.getElementById('winMoves'),
    winTime: document.getElementById('winTime'),
    winLevel: document.getElementById('winLevel'),
    winNote: document.getElementById('winNote'),
    nextBtn: document.getElementById('nextBtn'),
    retryBtn: document.getElementById('retryBtn'),
    selectBtn: document.getElementById('selectBtn'),
    live: document.getElementById('live')
  };

  /* ---------- storage ---------- */
  function loadBest() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveBest(data) {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(data)); } catch (e) {}
  }

  /* ---------- sound ---------- */
  var soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
  var audioCtx = null;
  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }
  function tone(freq, start, dur, type, vol) {
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime + start;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }
  function sfx(name) {
    if (!soundOn) return;
    if (name === 'flip') tone(520, 0, 0.09, 'triangle', 0.05);
    else if (name === 'match') { tone(660, 0, 0.12, 'sine', 0.06); tone(880, 0.09, 0.16, 'sine', 0.06); }
    else if (name === 'miss') { tone(200, 0, 0.14, 'sine', 0.05); tone(150, 0.08, 0.16, 'sine', 0.045); }
    else if (name === 'win') { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, i * 0.11, 0.22, 'sine', 0.06); }); }
  }
  function syncSoundBtn() {
    el.soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    el.soundBtn.setAttribute('aria-label', soundOn ? '音效：开启' : '音效：关闭');
  }
  syncSoundBtn();

  /* ---------- helpers ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function formatTime(ms) {
    var total = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
  }
  function starsFor(moves, pairs) {
    var ratio = moves / pairs;
    if (ratio <= 1.5) return 3;
    if (ratio <= 2.2) return 2;
    return 1;
  }
  function starRow(count) {
    var out = '';
    for (var i = 0; i < 3; i++) {
      out += '<svg class="' + (i < count ? '' : 'empty') + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#star-mark"/></svg>';
    }
    return out;
  }
  function gemColor(i) {
    var map = ['#7fd4e6','#e0606a','#5f8fe6','#45b98a','#a87ce8','#e2c35c','#9ccf5a','#d46a52','#cfd8ea','#e07bb4','#4f74d8','#3fae86'];
    return map[i % map.length];
  }
  function levelById(id) {
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].id === id) return LEVELS[i];
    return LEVELS[0];
  }

  /* ---------- level list ---------- */
  function renderLevels() {
    var best = loadBest();
    var html = '';
    LEVELS.forEach(function (lv, i) {
      var pairs = (lv.cols * lv.rows) / 2;
      var b = best[lv.id];
      var bestText = b ? ('最佳 ' + b.moves + ' 步 · ' + formatTime(b.time)) : '暂无记录';
      var stars = b ? b.stars : 0;
      var gems = '';
      for (var g = 0; g < Math.min(pairs, 6); g++) {
        gems += '<i style="background:' + gemColor(g) + '"></i>';
      }
      if (pairs > 6) gems += '<i style="background:var(--surface-3)"></i>';
      html += '<button class="level-card" type="button" data-level="' + lv.id + '" style="--i:' + i + '" aria-label="' +
        lv.name + '，第 ' + lv.id + ' 关，' + lv.cols + ' 乘 ' + lv.rows + ' 棋盘，' + pairs + ' 对宝石，预览 ' + (lv.preview / 1000) + ' 秒。' + bestText + '">' +
        '<span class="level-head"><span class="level-no" aria-hidden="true">' + lv.roman + '</span>' +
        '<span class="level-best">' + bestText + '</span></span>' +
        '<span class="level-name">' + lv.name + '</span>' +
        '<span class="level-meta">' + lv.cols + ' × ' + lv.rows + ' · ' + pairs + ' 对 · 预览 ' + (lv.preview / 1000) + 's</span>' +
        '<span class="level-foot"><span class="level-stars" aria-hidden="true">' + starRow(stars) + '</span>' +
        '<span class="level-gems" aria-hidden="true">' + gems + '</span></span>' +
      '</button>';
    });
    el.levelList.innerHTML = html;
  }

  /* ---------- game state ---------- */
  var game = null;
  var timerId = null;
  var previewId = null;

  function clearTimers() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (previewId) { clearTimeout(previewId); previewId = null; }
  }

  function startLevel(levelId) {
    clearTimers();
    var lv = levelById(levelId);
    var pairs = (lv.cols * lv.rows) / 2;
    var pool = [];
    for (var i = 0; i < GEM_NAMES.length; i++) pool.push(i);
    shuffle(pool);
    pool = pool.slice(0, pairs);
    var deck = pool.concat(pool);
    shuffle(deck);

    game = {
      level: lv,
      pairs: pairs,
      deck: deck,
      cards: [],
      first: null,
      second: null,
      locked: true,
      moves: 0,
      matched: 0,
      startTime: 0,
      elapsed: 0,
      finished: false
    };

    el.viewSelect.hidden = true;
    el.viewGame.hidden = false;
    el.winOverlay.hidden = true;
    el.statLevel.textContent = lv.roman;
    el.statMoves.textContent = '0';
    el.statTime.textContent = '0:00';
    el.statPairs.textContent = '0/' + pairs;

    buildBoard(deck, lv);
    announce(lv.name + ' 开始，' + pairs + ' 对宝石，请记住它们的位置。');
    runPreview(lv.preview);
  }

  function buildBoard(deck, lv) {
    el.board.style.setProperty('--cols', String(lv.cols));
    var frag = document.createDocumentFragment();
    game.cards = [];
    deck.forEach(function (gemIdx, i) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.setAttribute('role', 'gridcell');
      card.setAttribute('data-gem', String(gemIdx));
      card.setAttribute('data-index', String(i));
      card.setAttribute('tabindex', i === 0 ? '0' : '-1');
      card.setAttribute('aria-label', '第 ' + (i + 1) + ' 张，未翻开');
      card.innerHTML =
        '<span class="card-inner">' +
          '<span class="card-cover" aria-hidden="true"><svg viewBox="0 0 40 40"><use href="#cover-mark"/></svg></span>' +
          '<span class="card-face"><svg class="gem" viewBox="0 0 100 100" aria-hidden="true"><use href="#gem-' + (gemIdx + 1) + '"/></svg>' +
          '<span class="check" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#check-mark"/></svg></span></span>' +
        '</span>';
      frag.appendChild(card);
      game.cards.push(card);
    });
    el.board.innerHTML = '';
    el.board.appendChild(frag);
  }

  function runPreview(ms) {
    game.locked = true;
    game.cards.forEach(function (c) { c.classList.add('flipped'); });
    el.previewHint.hidden = false;
    var wait = reduceMotion ? Math.max(1200, ms * 0.75) : ms;
    previewId = setTimeout(function () {
      game.cards.forEach(function (c) {
        if (!c.classList.contains('matched')) c.classList.remove('flipped');
      });
      el.previewHint.hidden = true;
      game.locked = false;
      startTimer();
    }, wait);
  }

  function startTimer() {
    game.startTime = Date.now() - game.elapsed;
    timerId = setInterval(function () {
      game.elapsed = Date.now() - game.startTime;
      el.statTime.textContent = formatTime(game.elapsed);
    }, 200);
  }

  function announce(msg) { el.live.textContent = msg; }

  function cardLabel(card, revealed) {
    var n = Number(card.getAttribute('data-index')) + 1;
    if (card.classList.contains('matched')) {
      return '第 ' + n + ' 张，' + GEM_NAMES[Number(card.getAttribute('data-gem'))] + '，已配对';
    }
    if (revealed) {
      return '第 ' + n + ' 张，' + GEM_NAMES[Number(card.getAttribute('data-gem'))] + '，已翻开';
    }
    return '第 ' + n + ' 张，未翻开';
  }

  function flipCard(card) {
    if (!game || game.locked || game.finished) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    card.setAttribute('aria-label', cardLabel(card, true));
    sfx('flip');

    if (!game.first) {
      game.first = card;
      return;
    }
    game.first.setAttribute('aria-label', cardLabel(game.first, true));
    game.second = card;
    game.moves += 1;
    el.statMoves.textContent = String(game.moves);
    resolvePair();
  }

  function resolvePair() {
    var a = game.first, b = game.second;
    if (a.getAttribute('data-gem') === b.getAttribute('data-gem')) {
      a.classList.add('matched');
      b.classList.add('matched');
      a.disabled = true;
      b.disabled = true;
      a.setAttribute('aria-label', cardLabel(a, false));
      b.setAttribute('aria-label', cardLabel(b, false));
      game.matched += 1;
      el.statPairs.textContent = game.matched + '/' + game.pairs;
      sfx('match');
      announce('配对成功：' + GEM_NAMES[Number(a.getAttribute('data-gem'))] + '。已配对 ' + game.matched + ' / ' + game.pairs + '。');
      game.first = null;
      game.second = null;
      if (game.matched === game.pairs) win();
    } else {
      game.locked = true;
      sfx('miss');
      announce('不匹配，牌面翻回。');
      var fa = game.first, fb = game.second;
      setTimeout(function () {
        fa.classList.remove('flipped');
        fb.classList.remove('flipped');
        fa.setAttribute('aria-label', cardLabel(fa, false));
        fb.setAttribute('aria-label', cardLabel(fb, false));
        game.first = null;
        game.second = null;
        game.locked = false;
      }, 820);
    }
  }

  function win() {
    game.finished = true;
    clearTimers();
    game.elapsed = Date.now() - game.startTime;
    el.statTime.textContent = formatTime(game.elapsed);
    var stars = starsFor(game.moves, game.pairs);
    var id = game.level.id;
    var best = loadBest();
    var prev = best[id];
    var improved = !prev || game.moves < prev.moves || (game.moves === prev.moves && game.elapsed < prev.time);
    if (improved) {
      best[id] = { moves: game.moves, time: game.elapsed, stars: Math.max(stars, prev ? prev.stars : 0) };
      saveBest(best);
    }
    el.winStars.innerHTML = starRow(stars);
    el.winMoves.textContent = String(game.moves);
    el.winTime.textContent = formatTime(game.elapsed);
    el.winLevel.textContent = game.level.name;
    var hasNext = game.level.id < LEVELS.length;
    el.nextBtn.disabled = !hasNext;
    el.nextBtn.textContent = hasNext ? '下一关' : '已是最高难度';
    var note;
    if (improved && prev) note = '新纪录！步数与用时已更新。';
    else if (!prev) note = '首次通关，成绩已记录。';
    else note = '最佳纪录：' + best[id].moves + ' 步 · ' + formatTime(best[id].time);
    if (!hasNext && stars === 3) note = '宗师全三星，登顶宝石图鉴！';
    el.winNote.textContent = note;
    sfx('win');
    announce('通关！' + game.level.name + '，' + game.moves + ' 步，用时 ' + formatTime(game.elapsed) + '，' + stars + ' 星。');
    el.nextBtn.focus();
    el.winOverlay.hidden = false;
  }

  function goSelect() {
    clearTimers();
    el.winOverlay.hidden = true;
    el.viewGame.hidden = true;
    el.viewSelect.hidden = false;
    game = null;
    renderLevels();
    var target = el.levelList.querySelector('.level-card');
    if (target) target.focus();
  }

  /* ---------- board events ---------- */
  el.board.addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (card && el.board.contains(card)) flipCard(card);
  });

  el.board.addEventListener('keydown', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card) return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      flipCard(card);
      return;
    }
    var idx = Number(card.getAttribute('data-index'));
    var cols = game ? game.level.cols : 4;
    var total = game ? game.cards.length : 0;
    var next = -1;
    if (e.key === 'ArrowRight') next = idx + 1;
    else if (e.key === 'ArrowLeft') next = idx - 1;
    else if (e.key === 'ArrowDown') next = idx + cols;
    else if (e.key === 'ArrowUp') next = idx - cols;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = total - 1;
    if (next < 0 || next >= total) return;
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && Math.floor(next / cols) !== Math.floor(idx / cols)) return;
    e.preventDefault();
    var target = game.cards[next];
    game.cards.forEach(function (c, i) { c.setAttribute('tabindex', i === next ? '0' : '-1'); });
    target.focus();
  });

  el.board.addEventListener('focusin', function (e) {
    var card = e.target.closest ? e.target.closest('.card') : null;
    if (!card || !game) return;
    var idx = Number(card.getAttribute('data-index'));
    game.cards.forEach(function (c, i) { c.setAttribute('tabindex', i === idx ? '0' : '-1'); });
  });

  /* ---------- control events ---------- */
  el.levelList.addEventListener('click', function (e) {
    var card = e.target.closest ? e.target.closest('.level-card') : null;
    if (card) startLevel(Number(card.getAttribute('data-level')));
  });

  el.restartBtn.addEventListener('click', function () { if (game) startLevel(game.level.id); });
  el.backBtn.addEventListener('click', goSelect);
  el.selectBtn.addEventListener('click', goSelect);
  el.retryBtn.addEventListener('click', function () { if (game) { var id = game.level.id; clearTimers(); startLevel(id); } });
  el.nextBtn.addEventListener('click', function () {
    if (!game) return;
    var id = game.level.id;
    if (id < LEVELS.length) { clearTimers(); startLevel(id + 1); }
  });

  el.soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (e) {}
    syncSoundBtn();
    if (soundOn) sfx('flip');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !el.winOverlay.hidden) goSelect();
  });

  renderLevels();
})();
</script>
</body>
</html>
